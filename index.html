<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Snake and the Mirror Flashcards by LessonThrills</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-top: 20px;
        }

        #flashcard {
            position: relative;
            width: 80%;
            max-width: 600px;
            height: 300px;
            perspective: 1000px;
            margin: 20px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border-radius: 10px;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
            text-align: center;
        }

        .card-face.front {
            background: linear-gradient(45deg, #ff6f61, #ffcc2f);
            color: white;
        }

        .card-face.back {
            background: linear-gradient(45deg, #ffcc2f, #ff6f61);
            transform: rotateY(180deg);
            color: white;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 80%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .controls button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .controls button[disabled] {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .youtube-link {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .youtube-link img {
            margin-left: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .youtube-link img:hover {
            transform: scale(1.1);
        }

        @media only screen and (max-width: 768px) {
            .card-face {
                font-size: 1rem;
            }

            .controls button {
                font-size: 0.9rem;
                padding: 8px 16px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>The Snake and the Mirror Flashcards by LessonThrills</h1>

    <div id="flashcard">
        <div class="card">
            <div class="card-face front" id="question"></div>

                <h2>Detail Answer:</h2>
                <p id="answerText"></p>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="firstBtn">First</button>
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
    </div>

    <div class="youtube-link">
        <p>Click this YouTube icon to visit our YouTube channel:</p>

        </a>
    </div>

            {

            {

            },

            {

                answer: "The story teaches the unpredictability of life and the folly of vanity, reminding us that appearances and plans can be overturned by danger."

        ];

        let currentCard = 0;

        const questionDiv = document.getElementById('question');
        const answerDiv = document.getElementById('answerText');
        const card = document.querySelector('.card');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const firstBtn = document.getElementById('firstBtn');

        function updateFlashcard() {
            questionDiv.innerText = flashcards[currentCard].question;
            answerDiv.innerText = flashcards[currentCard].answer;
            prevBtn.disabled = currentCard === 0;
            nextBtn.disabled = currentCard === flashcards.length - 1;
            firstBtn.disabled = currentCard === 0;
        }

        card.addEventListener('click', function() {
            card.classList.toggle('is-flipped');
            const flipSound = new Audio('https://www.myinstants.com/media/sounds/page-flip.mp3');
            flipSound.play();
        });

        nextBtn.addEventListener('click', function() {
            if (currentCard < flashcards.length - 1) {
                currentCard++;
                updateFlashcard();
                card.classList.remove('is-flipped');
            }
        });

        prevBtn.addEventListener('click', function() {
            if (currentCard > 0) {
                currentCard--;
                updateFlashcard();
                card.classList.remove('is-flipped');
            }
        });

        firstBtn.addEventListener('click', function() {
            currentCard = 0;
            updateFlashcard();
            card.classList.remove('is-flipped');
        });

        // Initialize the first card
        updateFlashcard();
    </script>

</body>
</html>
